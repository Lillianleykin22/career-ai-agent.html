<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>סוכן AI להכוונה בקריירה</title>
</head>
<body>

<h1>🤖 סוכן קריירה AI</h1>

<label>שם מלא:</label>
<input type="text" id="fullname" placeholder="ישראל ישראלי">
<br><br>

<label>תאריך לידה:</label>
<input type="date" id="birthday">
<br><br>

<label>גיל:</label>
<input type="number" id="age" placeholder="25">
<br><br>

<label>עיר מגורים:</label>
<input type="text" id="city" placeholder="תל אביב">
<br><br>

<label>עבודה נוכחית:</label>
<input type="text" id="currentjob" placeholder="מזכירה">
<br><br>

<label>השכלה:</label>
<input type="text" id="education" placeholder="לדוגמה: מח״ט, בוגרת תיכון">
<br><br>

<label>מה את יודעת? (כישורים):</label>
<input type="text" id="knowledge" placeholder="C#, HTML, JavaScript">
<br><br>

<label>קריירה רצויה:</label>
<input type="text" id="dreamjob" placeholder="מפתחת Frontend">
<br><br>

<button onclick="analyze()">נתח אותי! 🚀</button>
<div id="result"></div>

</body>
</html>
